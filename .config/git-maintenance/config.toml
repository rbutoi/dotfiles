# Background git fetch + maintenance schedule.
#
# Driven by ~/.local/bin/git_maintenance_tick.py, which a scheduler wakes every
# 15 minutes; the script decides what is actually due. Each repo gets a fetch
# interval for business hours and a relaxed one for everything else (relaxed,
# never off), plus daily and weekly `git maintenance` housekeeping.
#
#   git_maintenance_tick.py --status                # what's scheduled, what's stale
#   git_maintenance_tick.py --dry-run               # what the next tick would do
#   git_maintenance_tick.py --force --repo ~/dev/x  # run one repo right now
#   git_maintenance_tick.py --status --at 2026-08-04T22:00   # simulate a clock
#
# Enable the scheduler (once per machine, after `dotup`):
#
#   macOS   launchctl bootstrap gui/(id -u) ~/Library/LaunchAgents/dev.radu.git-maintenance.plist
#           launchctl kickstart -p gui/(id -u)/dev.radu.git-maintenance   # force a tick
#           logs: ~/Library/Logs/git-maintenance/tick.{out,err}.log
#
#   Linux   systemctl --user enable --now git-maintenance.timer
#           systemctl --user list-timers git-maintenance
#           logs: journalctl --user -u git-maintenance
#
# Machine-specific repos belong in config.local.toml, which is merged over this
# file ([defaults] and [business_hours] keys override; [[repo]] entries add).
# Keep it in the private-dots env so `dot` links it in beside this one, exactly
# like .config/git/config + config.local:
#
#   ~/.dots/private-dots/.config/git-maintenance/config.local.toml
#
# Intervals take a unit suffix: s, m, h, d, w. Anything shorter than the 15m
# scheduler tick is effectively 15m.

[defaults]
business = "1h"
off      = "8h"
daily    = "24h"    # loose-objects + incremental-repack
weekly   = "7d"     # pack-refs

# Anything outside this window — nights, weekends — uses the `off` interval.
[business_hours]
days  = "mon-fri"
start = "07:00"
end   = "19:00"

# `path` names repos in one of three ways. `depth` is a separate key on its own
# line — TOML has no `path = "~/dev", depth = 1` form:
#
#   path = "~/dev/repo"        one repo
#
#   path = "~/dev/*"           a glob; `*` does not cross a `/`, so this is
#                              exactly the direct children, never ~/dev/*/*
#
#   path  = "~/dev"            a root to scan below: 1 = direct children,
#   depth = 2                  2 = children and grandchildren, 0 = unlimited
#
# A scan stops at each repo it finds and never looks inside it, so vendored
# checkouts and submodules stay out. `~/dev/*` and `~/dev` + depth 1 are the
# same set; depth 2 also pulls in ~/dev/oss/*, ~/dev/jj/* and so on.
#
# Two traps worth knowing:
#
#   - Combining them scans below *each* glob match, so `~/dev/*` with depth 1
#     means ~/dev/*/* too. For direct children only, use one or the other.
#   - A root that is itself a repo is taken as-is and not descended into. That
#     is why ~/.dots below is a glob: ~/.dots is a repo, so scanning it would
#     match only ~/.dots and miss dotfiles and private-dots.
#
# When several entries match one repo the most specific wins: an exact path
# beats a glob or a scan, then the longer pattern, then the later entry — so a
# broad scan can be overridden for one subtree or one repo.

[[repo]]                        # dotfiles + private-dots (see the note above)
path     = "~/.dots/*"

[[repo]]                        # direct children only, no ~/dev/*/*
path     = "~/dev/*"
business = "15m"
